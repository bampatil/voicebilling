name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VoiceBilling.apk

      - uses: actions/upload-artifact@v6
        with:
          name: VoiceBilling-apk
          path: VoiceBilling.apk

      # Plain .apk at a fixed link:
      # https://github.com/<you>/<repo>/releases/latest/download/VoiceBilling.apk
      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VoiceBilling.apk \
            --title "Voice Billing $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Offline voice billing: say items in Kannada, English or Hindi." \
            --target "$GITHUB_SHA" --latest
